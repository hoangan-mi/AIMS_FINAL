<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UTT AIMS | Đặt lại mật khẩu</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(125deg,#9e3009,#ef661d 47%,#ff9a55);font-family:Arial,sans-serif}
    .panel{width:min(440px,calc(100% - 36px));box-sizing:border-box;background:#fff;padding:38px;border-radius:20px;box-shadow:0 25px 65px #5c1f074d}
    h1{font-size:26px;color:#202d43;margin:0 0 10px}.lead{color:#69778a;line-height:1.6;margin:0 0 24px}
    form{display:grid;gap:12px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d8dee8;border-radius:9px;font-size:15px}
    button{padding:13px;border:0;border-radius:9px;background:#ef661d;color:white;font-weight:700;font-size:15px;cursor:pointer}
    .error{padding:12px;background:#fff1f1;color:#bd3636;border-radius:9px;line-height:1.5}.success{padding:12px;background:#edf8f2;color:#168358;border-radius:9px;line-height:1.5}
    .back{display:block;margin-top:18px;text-align:center;color:#d95512;text-decoration:none}
  </style>
</head>
<body><main class="panel">
  <h1>Đặt lại mật khẩu</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if success %}<p class="success">{{ success }}</p><a class="back" href="{{ url_for('login') }}">Quay lại đăng nhập</a>
  {% else %}
    <p class="lead">Mật khẩu mới cần có ít nhất 8 ký tự.</p>
    <form method="post">
      <input type="password" name="password" placeholder="Mật khẩu mới" autocomplete="new-password" minlength="8" required>
      <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" minlength="8" required>
      <button type="submit">Lưu mật khẩu mới</button>
    </form>
  {% endif %}
</main></body>
</html>
