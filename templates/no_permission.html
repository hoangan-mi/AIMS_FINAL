<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIMS | Không có quyền truy cập</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 0 0,#fff0e7 0,transparent 32%), #f6f8fb;
      font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .error-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 44px 36px;
      box-shadow: 0 20px 45px rgba(23,32,51,.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: rise .45s ease both;
    }
    .error-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #fee2e2;
      color: #dc2626;
      display: inline-grid;
      place-items: center;
      font-size: 34px;
      margin-bottom: 22px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 12px;
      letter-spacing: -.5px;
    }
    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.65;
      margin: 0 0 28px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      background: linear-gradient(120deg, var(--orange), #ff914d);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      box-sizing: border-box;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 20px rgba(238,106,36,.3);
    }
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-icon">🚫</div>
    <h1>Bạn không có quyền truy cập trang này</h1>
    <p>Tài khoản của bạn không được phân quyền để thực hiện chức năng này. Vui lòng bấm vào nút bên dưới để quay về trang chủ.</p>
    <a href="/" class="btn-home">← Quay lại trang chủ</a>
  </main>
</body>
</html>
